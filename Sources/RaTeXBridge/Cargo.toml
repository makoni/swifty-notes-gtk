[package]
name = "ratex_bridge"
version = "0.1.0"
edition = "2021"
# The highest rust-version among the locked dependencies.
rust-version = "1.88"
license = "MIT"
publish = false
description = "Plain-C bridge over the RaTeX math engine for the Swifty Notes preview"

[lib]
name = "ratex_bridge"
# The artefact is libratex_bridge.a, which scripts/build-ratex-bridge.sh
# stages in build/ratex-bridge/lib and Package.swift links into the app.
crate-type = ["staticlib"]

[profile.release]
# RaTeX's own workspace builds with panic = "abort". This crate must not:
# every C entry point catches panics and reports them as an error, and an
# aborting panic would take the whole app down instead.
lto = true
codegen-units = 1

[dependencies]
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
# The KaTeX fonts compiled in; without them RaTeX would look for font files
# in the working directory.
ratex-cairo = { version = "=0.1.15", features = ["embed-fonts"] }
ratex-types = "=0.1.15"
ratex-unicode-font = "=0.1.15"
# Same majors as ratex-cairo uses, so the types line up.
cairo-rs = "0.20"
ab_glyph = "0.2"
